<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>

        <form class="checkout-form" name="checkout-form">
          <input type="hidden" name="orderDate" id="orderDate" />

          <fieldset>
            <legend>Customer Information</legend>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" value="David" required />

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" value="Test" required />

            <label for="street">Street Address:</label>
            <input
              type="text"
              id="street"
              name="street"
              value="5432 Test St"
              required
            />

            <label for="city">City:</label>
            <input
              type="text"
              id="city"
              name="city"
              value="Test City"
              required
            />

            <label for="state">State:</label>
            <input type="text" id="state" name="state" value="UT" required />

            <label for="zip">Zip Code:</label>
            <input type="text" id="zip" name="zip" value="12345" required />
          </fieldset>

          <fieldset>
            <legend>Payment Information</legend>
            <label for="cardNumber">Credit Card Number:</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              value="1234123412341234"
              required
            />

            <label for="expiration">Expiration Date:</label>
            <input
              type="text"
              id="expiration"
              name="expiration"
              placeholder="MM/YY"
              value="12/28"
              required
            />

            <label for="code">Security Code (CVV):</label>
            <input type="text" id="code" name="code" value="123" required />
          </fieldset>

          <fieldset>
            <legend>Order Summary</legend>
            <div class="order-summary">
              <p class="subtotal">Subtotal: $0.00</p>
              <p class="tax">Tax: $0.00</p>
              <p class="shipping">Shipping Estimate: $0.00</p>
              <p class="orderTotal">Order Total: $0.00</p>
            </div>
          </fieldset>

          <button type="submit" id="placeOrder">Place Order</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
